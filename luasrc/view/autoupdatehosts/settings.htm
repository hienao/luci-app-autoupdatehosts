<%+header%>

<style>
.main-content {
    padding: 20px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
}

.settings-section {
    margin-bottom: 20px;
    width: 100%;
}

.settings-row {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
    width: 100%;
}

.settings-label {
    width: 150px;
    flex-shrink: 0;
}

.settings-input {
    flex-grow: 1;
    width: calc(100% - 150px);
}

.schedule-container {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.hosts-editor {
    width: 100%;
    height: 400px;
    font-family: monospace;
    padding: 10px;
    margin: 10px 0;
    resize: vertical;
    box-sizing: border-box;
}

.button-group {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

.cbi-button {
    min-width: 120px;
}

.schedule-select {
    width: auto;
    min-width: 80px;
}
</style>

<div class="main-content">
    <h2><%:Auto Update Hosts Settings%></h2>
    
    <div class="settings-section">
        <div class="settings-row">
            <label class="settings-label"><%:Enable%></label>
            <div class="settings-input">
                <input type="checkbox" id="enable" />
            </div>
        </div>

        <div class="settings-row">
            <label class="settings-label"><%:Update Schedule%></label>
            <div class="settings-input schedule-container">
                <select id="schedule_type" class="schedule-select" onchange="updateScheduleInputs()">
                    <option value="none"><%:Disabled%></option>
                    <option value="daily"><%:Daily%></option>
                    <option value="weekly"><%:Weekly%></option>
                    <option value="monthly"><%:Monthly%></option>
                </select>
                <span id="day_container" style="display:none">
                    <%:Day%>: 
                    <select id="schedule_day" style="width:60px">
                        <% for i = 1, 31 do %>
                            <option value="<%=i%>"><%=i%></option>
                        <% end %>
                    </select>
                </span>
                <span id="week_container" style="display:none">
                    <%:Week%>: 
                    <select id="schedule_week" style="width:100px">
                        <option value="1"><%:Monday%></option>
                        <option value="2"><%:Tuesday%></option>
                        <option value="3"><%:Wednesday%></option>
                        <option value="4"><%:Thursday%></option>
                        <option value="5"><%:Friday%></option>
                        <option value="6"><%:Saturday%></option>
                        <option value="0"><%:Sunday%></option>
                    </select>
                </span>
                <span id="time_container">
                    <%:Time%>: 
                    <select id="schedule_hour" style="width:80px">
                        <% for i = 0, 23 do %>
                            <option value="<%=i%>"><%=string.format("%02d", i)%></option>
                        <% end %>
                    </select>
                    :
                    <select id="schedule_minute" style="width:80px">
                        <% for i = 0, 59 do %>
                            <option value="<%=i%>"><%=string.format("%02d", i)%></option>
                        <% end %>
                    </select>
                </span>
            </div>
        </div>

        <div class="settings-row">
            <label class="settings-label"><%:Subscription URL%></label>
            <div class="settings-input">
                <textarea id="subscription_urls" class="cbi-input-textarea" style="width:100%; height:100px;" 
                    placeholder="<%:One URL per line%>"></textarea>
            </div>
        </div>

        <div class="settings-row">
            <label class="settings-label"><%:Backup Path%></label>
            <div class="settings-input">
                <input type="text" id="bakPath" class="cbi-input-text" style="width:100%" 
                    placeholder="/etc/auto_undate_host/hosts.bak" />
            </div>
        </div>

        <div class="settings-row">
            <label class="settings-label"><%:Hosts Content%></label>
            <div class="settings-input">
                <textarea id="hosts_content" class="hosts-editor"></textarea>
            </div>
        </div>

        <div class="button-group">
            <input type="button" class="cbi-button cbi-button-apply" value="<%:View Current Hosts%>" onclick="viewCurrentHosts()" />
            <input type="button" class="cbi-button cbi-button-apply" value="<%:View Backup Hosts File%>" onclick="viewBackupHosts()" />
            <input type="button" class="cbi-button cbi-button-apply" value="<%:Preview Hosts%>" onclick="previewHosts()" />
            <input type="button" class="cbi-button cbi-button-apply" value="<%:Backup Current Hosts%>" onclick="backupHosts()" />
            <input type="button" class="cbi-button cbi-button-save" value="<%:Save%>" onclick="saveHosts()" />
        </div>
    </div>
</div>

<script type="text/javascript">
var ui = require('luci.ui');

function viewCurrentHosts() {
    XHR.get('<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "get_hosts")%>', null,
        function(x, res) {
            if (x.status == 200) {
                document.getElementById('hosts_content').value = decodeURIComponent(escape(x.responseText));
            } else {
                document.getElementById('hosts_content').value = '获取失败：' + x.status;
            }
        },
        function() {
            document.getElementById('hosts_content').value = '获取失败：网络错误';
        }
    );
}

function viewBackupHosts() {
    XHR.get('<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "get_backup")%>', null,
        function(x, res) {
            if (x.status == 200) {
                document.getElementById('hosts_content').value = decodeURIComponent(escape(x.responseText));
            } else {
                document.getElementById('hosts_content').value = '获取失败：' + x.status;
            }
        },
        function() {
            document.getElementById('hosts_content').value = '获取失败：网络错误';
        }
    );
}

function previewHosts() {
    var urls = document.getElementById('subscription_urls').value.split('\n').filter(url => url.trim() !== '');
    if (urls.length === 0) {
        document.getElementById('hosts_content').value = '请先输入订阅URL';
        return;
    }

    document.getElementById('hosts_content').value = '正在获取hosts内容...';

    XHR.post('<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "preview")%>', 
        { urls: JSON.stringify(urls) },
        function(x, res) {
            if (x.status == 200) {
                document.getElementById('hosts_content').value = x.responseText;
            } else {
                document.getElementById('hosts_content').value = '预览失败：' + x.status;
            }
        },
        function() {
            document.getElementById('hosts_content').value = '预览失败：网络错误';
        }
    );
}

function backupHosts() {
    XHR.post('<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "create_backup")%>', null,
        function(x, result) {
            if (result.code === 0) {
                alert('备份创建成功');
            } else {
                alert('备份创建失败');
            }
        }
    );
}

function saveHosts() {
    var content = document.getElementById('hosts_content').value;
    XHR.post('<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "save_hosts")%>', 
        { content: content },
        function(x, result) {
            if (x.status == 200) {
                alert('保存成功');
            } else {
                alert('保存失败');
            }
        },
        function() {
            alert('保存失败：网络错误');
        }
    );
}

function updateScheduleInputs() {
    var type = document.getElementById('schedule_type').value;
    var dayContainer = document.getElementById('day_container');
    var weekContainer = document.getElementById('week_container');
    var timeContainer = document.getElementById('time_container');
    
    // 隐藏所有容器
    dayContainer.style.display = 'none';
    weekContainer.style.display = 'none';
    timeContainer.style.display = 'none';
    
    // 根据选择显示对应的输入框
    switch(type) {
        case 'monthly':
            dayContainer.style.display = 'inline';
            timeContainer.style.display = 'inline';
            break;
        case 'weekly':
            weekContainer.style.display = 'inline';
            timeContainer.style.display = 'inline';
            break;
        case 'daily':
            timeContainer.style.display = 'inline';
            break;
    }
}

window.addEventListener('load', function() {
    updateScheduleInputs();
    // 获取设置
    XHR.get('<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "get_settings")%>', null,
        function(x, data) {
            if (data) {
                if (data.urls) {
                    document.getElementById('subscription_urls').value = data.urls;
                }
            }
        }
    );

    viewCurrentHosts();
});
</script>

<%+footer%>
