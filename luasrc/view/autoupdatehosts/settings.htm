<%+header%>

<style>
.main-content {
    padding: 20px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
}

.settings-section {
    margin-bottom: 20px;
    width: 100%;
}

.settings-row {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
    width: 100%;
}

.settings-label {
    width: 150px;
    flex-shrink: 0;
}

.settings-input {
    flex-grow: 1;
    width: calc(100% - 150px);
}

.schedule-container {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.hosts-editor {
    width: 100%;
    height: 400px;
    font-family: monospace;
    padding: 10px;
    margin: 10px 0;
    resize: vertical;
    box-sizing: border-box;
}

.button-group {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

.cbi-button {
    min-width: 120px;
}

.schedule-select {
    width: auto;
    min-width: 80px;
}

.loading-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9999;
}

.loading-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 20px;
    border-radius: 5px;
    text-align: center;
}

.loading-spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 10px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>

<div class="main-content">
    <h2><%:Auto Update Hosts Settings%></h2>
    
    <div class="settings-section">
        <div class="settings-row">
            <label class="settings-label"><%:Enable%></label>
            <div class="settings-input">
                <input type="checkbox" id="enable" />
            </div>
        </div>

        <div class="settings-row">
            <label class="settings-label"><%:Update Schedule%></label>
            <div class="settings-input schedule-container">
                <select id="schedule_type" class="schedule-select" onchange="updateScheduleInputs()">
                    <option value="none"><%:Disabled%></option>
                    <option value="daily"><%:Daily%></option>
                    <option value="weekly"><%:Weekly%></option>
                    <option value="monthly"><%:Monthly%></option>
                </select>
                <span id="day_container" style="display:none">
                    <%:Day%>: 
                    <select id="schedule_day" style="width:60px">
                        <% for i = 1, 31 do %>
                            <option value="<%=i%>"><%=i%></option>
                        <% end %>
                    </select>
                </span>
                <span id="week_container" style="display:none">
                    <%:Week%>: 
                    <select id="schedule_week" style="width:100px">
                        <option value="1"><%:Monday%></option>
                        <option value="2"><%:Tuesday%></option>
                        <option value="3"><%:Wednesday%></option>
                        <option value="4"><%:Thursday%></option>
                        <option value="5"><%:Friday%></option>
                        <option value="6"><%:Saturday%></option>
                        <option value="0"><%:Sunday%></option>
                    </select>
                </span>
                <span id="time_container">
                    <%:Time%>: 
                    <select id="schedule_hour" style="width:80px">
                        <% for i = 0, 23 do %>
                            <option value="<%=i%>"><%=string.format("%02d", i)%></option>
                        <% end %>
                    </select>
                    :
                    <select id="schedule_minute" style="width:80px">
                        <% for i = 0, 59 do %>
                            <option value="<%=i%>"><%=string.format("%02d", i)%></option>
                        <% end %>
                    </select>
                </span>
            </div>
        </div>

        <div class="settings-row">
            <label class="settings-label"><%:Subscription URL%></label>
            <div class="settings-input">
                <textarea id="subscription_urls" class="cbi-input-textarea" style="width:100%; height:100px;" 
                    placeholder="<%:One URL per line%>"></textarea>
            </div>
        </div>

        <div class="settings-row">
            <label class="settings-label"><%:Backup Path%></label>
            <div class="settings-input">
                <input type="text" id="bakPath" class="cbi-input-text" style="width:100%" 
                    placeholder="/etc/auto_update_host/hosts.bak" />
            </div>
        </div>

        <div class="settings-row">
            <label class="settings-label"><%:Hosts Content%></label>
            <div class="settings-input">
                <textarea id="hosts_content" class="hosts-editor"></textarea>
            </div>
        </div>

        <div class="button-group">
            <input type="button" class="cbi-button cbi-button-apply" value="<%:View Current Hosts%>" onclick="viewCurrentHosts()" />
            <input type="button" class="cbi-button cbi-button-apply" value="<%:View Backup Hosts File%>" onclick="viewBackupHosts()" />
            <input type="button" class="cbi-button cbi-button-apply" value="<%:Preview Hosts%>" onclick="previewHosts()" />
            <input type="button" class="cbi-button cbi-button-apply" value="<%:Backup Current Hosts%>" onclick="backupHosts()" />
            <input type="button" class="cbi-button cbi-button-save" value="<%:Save Hosts%>" onclick="saveHosts()" />
            <input type="button" class="cbi-button cbi-button-save" value="<%:Save Settings%>" onclick="saveSettings()" />
            <input type="button" class="cbi-button cbi-button-remove" value="<%:Reset Settings%>" onclick="resetSettings()" />
        </div>
    </div>
</div>

<div id="loading" class="loading-overlay">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <div id="loading-text"><%:Processing...%></div>
    </div>
</div>

<script type="text/javascript">
// 定义一个通用的 HTTP 请求函数
function makeRequest(method, url, data, successCallback, errorCallback) {
    if (typeof XHR === 'object' && XHR.post) {
        // 新版本 OpenWrt
        if (method.toLowerCase() === 'post') {
            XHR.post(url, data, successCallback, errorCallback);
        } else {
            XHR.get(url, data, successCallback, errorCallback);
        }
    } else {
        // 旧版本 OpenWrt
        new XHR().post(url, data, successCallback, errorCallback);
    }
}

function viewCurrentHosts() {
    makeRequest('get', '<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "get_hosts")%>', null,
        function(x, res) {
            if (x.status == 200) {
                document.getElementById('hosts_content').value = x.responseText;
            } else {
                document.getElementById('hosts_content').value = '<%:Failed to get hosts%>: ' + x.status;
            }
        },
        function() {
            document.getElementById('hosts_content').value = '<%:Failed to get hosts: Network error%>';
        }
    );
}

function viewBackupHosts() {
    XHR.get('<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "get_backup")%>', null,
        function(x, res) {
            if (x.status == 200) {
                document.getElementById('hosts_content').value = x.responseText;
            } else {
                document.getElementById('hosts_content').value = '<%:Failed to get hosts%>: ' + x.status;
            }
        },
        function() {
            document.getElementById('hosts_content').value = '<%:Failed to get hosts: Network error%>';
        }
    );
}

function showLoading(text) {
    document.getElementById('loading-text').textContent = text || '<%:Processing...%>';
    document.getElementById('loading').style.display = 'block';
}

function hideLoading() {
    document.getElementById('loading').style.display = 'none';
}

function setupTimeout(timeoutCallback) {
    return setTimeout(() => {
        hideLoading();
        timeoutCallback();
    }, 120000); // 2分钟超时
}

function previewHosts() {
    var urls = document.getElementById('subscription_urls').value.split('\n').filter(url => url.trim() !== '');
    if (urls.length === 0) {
        document.getElementById('hosts_content').value = '请先输入订阅URL';
        return;
    }

    showLoading('<%:Fetching and validating hosts content...%>');
    document.getElementById('hosts_content').value = '正在获取hosts内容...';

    const timeoutId = setupTimeout(() => {
        document.getElementById('hosts_content').value = '<%:Operation timed out after 2 minutes%>';
    });

    makeRequest('post', '<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "preview")%>', 
        { urls: JSON.stringify(urls) },
        function(x, res) {
            clearTimeout(timeoutId);
            hideLoading();
            if (x.status == 200) {
                document.getElementById('hosts_content').value = x.responseText;
            } else {
                document.getElementById('hosts_content').value = '预览失败：' + x.status;
            }
        },
        function() {
            clearTimeout(timeoutId);
            hideLoading();
            document.getElementById('hosts_content').value = '预览失败：网络错误';
        }
    );
}

function backupHosts() {
    showLoading('<%:Creating hosts backup...%>');
    
    const timeoutId = setupTimeout(() => {
        alert('<%:Operation timed out after 2 minutes%>');
    });

    makeRequest('post', '<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "create_backup")%>', null,
        function(x, result) {
            clearTimeout(timeoutId);
            hideLoading();
            if (x.status == 200) {
                try {
                    result = JSON.parse(x.responseText);
                } catch(e) {
                    result = null;
                }
            }
            if (result && result.code === 0) {
                alert('<%:Backup created successfully%>');
            } else {
                alert('<%:Failed to create backup%>');
            }
        },
        function() {
            clearTimeout(timeoutId);
            hideLoading();
            alert('<%:Network error while creating backup%>');
        }
    );
}

function saveHosts() {
    var content = document.getElementById('hosts_content').value;
    showLoading('<%:Validating and saving hosts file...%>');
    
    const timeoutId = setupTimeout(() => {
        alert('<%:Operation timed out after 2 minutes%>');
    });

    makeRequest('post', '<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "save_hosts")%>', 
        { content: content },
        function(x, result) {
            clearTimeout(timeoutId);
            hideLoading();
            if (x.status == 200) {
                try {
                    result = JSON.parse(x.responseText);
                } catch(e) {
                    result = null;
                }
            }
            if (result && result.code === 0) {
                alert('<%:Hosts saved successfully%>');
            } else {
                alert('<%:Failed to save hosts%>');
            }
        },
        function() {
            clearTimeout(timeoutId);
            hideLoading();
            alert('<%:Failed to save hosts: Network error%>');
        }
    );
}

function updateScheduleInputs() {
    var type = document.getElementById('schedule_type').value;
    var dayContainer = document.getElementById('day_container');
    var weekContainer = document.getElementById('week_container');
    var timeContainer = document.getElementById('time_container');
    
    // 隐藏所有容器
    dayContainer.style.display = 'none';
    weekContainer.style.display = 'none';
    timeContainer.style.display = 'none';
    
    // 根据选择显示对应的输入框
    switch(type) {
        case 'monthly':
            dayContainer.style.display = 'inline';
            timeContainer.style.display = 'inline';
            break;
        case 'weekly':
            weekContainer.style.display = 'inline';
            timeContainer.style.display = 'inline';
            break;
        case 'daily':
            timeContainer.style.display = 'inline';
            break;
    }
}

function saveSettings() {
    // 收集表单数据
    var data = {
        enable: document.getElementById('enable').checked ? 'true' : 'false',
        schedule_type: document.getElementById('schedule_type').value,
        schedule_hour: document.getElementById('schedule_hour').value,
        schedule_minute: document.getElementById('schedule_minute').value,
        subscription_urls: document.getElementById('subscription_urls').value,
        bakPath: document.getElementById('bakPath').value.trim() || '/etc/auto_update_host/hosts.bak'
    };
    
    // 根据调度类型添加额外数据
    if (data.schedule_type === 'monthly') {
        data.schedule_day = document.getElementById('schedule_day').value;
    } else if (data.schedule_type === 'weekly') {
        data.schedule_week = document.getElementById('schedule_week').value;
    }
    
    // 发送保存请求
    makeRequest('post', '<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "save_settings")%>', data,
        function(x, result) {
            if (x.status == 200) {
                try {
                    result = JSON.parse(x.responseText);
                } catch(e) {
                    result = null;
                }
            }
            
            if (result && result.code === 0) {
                if (!data.bakPath.trim()) {
                    document.getElementById('bakPath').value = data.bakPath;
                }
                alert('<%:Settings saved successfully%>');
            } else {
                alert('<%:Failed to save settings%>');
            }
        },
        function() {
            alert('<%:Failed to save settings: Network error%>');
        }
    );
}

function resetSettings() {
    if (!confirm('<%:Are you sure you want to reset all settings? This cannot be undone.%>')) {
        return;
    }
    
    XHR.post('<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "reset_settings")%>', null,
        function(x, result) {
            if (result && result.code === 0) {
                alert('<%:Settings have been reset successfully%>');
                window.location.reload();
            } else {
                alert('<%:Failed to reset settings%>');
            }
        }
    );
}

window.addEventListener('load', function() {
    updateScheduleInputs();
    // 获取设置
    XHR.get('<%=luci.dispatcher.build_url("admin", "services", "autoupdatehosts", "get_settings")%>', null,
        function(x, data) {
            console.log('Received settings:', data); // 添加调试日志
            if (data) {
                // 加载启用状态
                document.getElementById('enable').checked = data.enable === "true";
                
                // 加载备份路径
                if (data.bakPath) {
                    document.getElementById('bakPath').value = data.bakPath;
                }
                
                // 修改加载订阅URLs的逻辑
                if (data.urls) {
                    // 确保无论data.urls是字符串还是数组都能正确处理
                    let urlList = Array.isArray(data.urls) ? data.urls : [data.urls];
                    document.getElementById('subscription_urls').value = urlList.join('\n');
                }
                
                // 加载调度设置
                if (data.cron) {
                    var [minute, hour, day, month, week] = data.cron.split(' ');
                    
                    // 设置时间
                    document.getElementById('schedule_hour').value = hour;
                    document.getElementById('schedule_minute').value = minute;
                    
                    // 确定调度类型并设置相应的值
                    if (day !== '*' && week === '*') {
                        document.getElementById('schedule_type').value = 'monthly';
                        document.getElementById('schedule_day').value = day;
                    } else if (week !== '*' && day === '*') {
                        document.getElementById('schedule_type').value = 'weekly';
                        document.getElementById('schedule_week').value = week;
                    } else if (day === '*' && week === '*') {
                        document.getElementById('schedule_type').value = 'daily';
                    } else {
                        document.getElementById('schedule_type').value = 'none';
                    }
                    
                    // 更新显示状态
                    updateScheduleInputs();
                }
            }
        }
    );

    viewCurrentHosts();
});
</script>

<%+footer%>
