name: Build and Release

on:
  push:
    branches:
      - main
      - pre

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build and Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Set Release Info
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/pre" ]]; then
            echo "RELEASE_VERSION=pre-$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            VERSION=$(cat version.txt 2>/dev/null | tr -d '[:space:]' || echo "v1.0.0")
            echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Install Essential Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext

      # 缓存SDK下载
      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v3
        with:
          path: openwrt-sdk-*.tar.xz
          key: ${{ runner.os }}-openwrt-sdk-22.03.5-tarball

      - name: Setup OpenWrt SDK
        run: |
          if [ ! -f openwrt-sdk-*.tar.xz ]; then
            wget -q https://downloads.openwrt.org/releases/22.03.5/targets/x86/64/openwrt-sdk-22.03.5-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz
          fi
          rm -rf sdk/
          tar xf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-22.03.5-x86-64_gcc-11.2.0_musl.Linux-x86_64 sdk

      - name: Setup SDK Environment
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ln -sf $GITHUB_WORKSPACE package/luci-app-autoupdatehosts

      - name: Build Package
        run: |
          cd sdk
          rm -rf bin/packages/*/base/
          rm -rf build_dir/target-*/luci-*
          rm -rf staging_dir/target-*/packages/luci-*
          rm -rf tmp/info/.packageinfo-*
          
          make defconfig
          make package/luci-app-autoupdatehosts/compile V=s

      # 添加清理步骤，在创建新发布之前执行
      - name: Delete Old Prereleases
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          # 获取所有预发布和草稿版本
          releases=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.prerelease or .draft) | .id')
          
          # 删除找到的版本
          for release_id in $releases; do
            echo "Deleting release ID: $release_id"
            gh api -X DELETE repos/${{ github.repository }}/releases/$release_id
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: sdk/bin/packages/*/base/luci-*autoupdatehosts*.ipk
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          token: ${{ secrets.REPO_TOKEN }}